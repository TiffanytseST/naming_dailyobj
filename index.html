<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命名練習：日常用品</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:space-between;
            min-height:100vh;
            margin:0;
            background:#f4f4f9;
        }
        .container{
            width:90%;
            max-width:800px;
            text-align:center;
            padding:20px;
            display:flex;
            flex-direction:column;
            align-items:center;
            flex-grow:1;
        }
        h1{color:#333;margin-bottom:20px}
        #item-image{
            max-width:90%;
            height:auto;
            max-height:58vh;
            border:5px solid #fff;
            box-shadow:0 4px 15px rgba(0,0,0,.1);
            border-radius:12px;
            margin:15px auto;
            display:block;
        }
        /* 答案文字 */
        #message{
            font-size:2.4em;
            color:#333;
            min-height:90px;
            margin:20px 0;
            font-weight:bold;
        }
        /* 提示鍵：放在圖片下方，與圖片距離適中 */
        #cue-button{
            background:#007bff;
            color:#fff;
            padding:14px 40px;
            font-size:1.5em;
            border:none;
            border-radius:10px;
            cursor:pointer;
            margin-top:18px;     /* 與圖片之間距離 */
            margin-bottom:25px;
        }
        #cue-button:hover{background:#0056b3}
        #start-button{
            background:#28a745;
            color:#fff;
            padding:16px 44px;
            font-size:1.7em;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
        #start-button:hover{background:#1e7e34}
        .progress-bar-container{
            width:100%;
            max-width:800px;
            margin-top:auto;
            padding:10px;
            background:#e9ecef;
            border-top:1px solid #ddd;
        }
        #progress-bar{
            height:38px;
            background:#ffc107;
            border-radius:6px;
            transition:width .5s;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#333;
            font-weight:bold;
            font-size:1.3em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>命名練習：日常用品</h1>
        
        <img id="item-image" src="" alt="目標物品圖片" style="display:none">

        <!-- 提示鍵放在圖片下方 -->
        <button id="cue-button" style="display:none">提示</button>

        <!-- 答案文字 -->
        <div id="message"></div>

        <!-- 開始練習鍵 -->
        <button id="start-button">開始練習</button>
    </div>

    <div class="progress-bar-container"><div id="progress-bar"></div></div>

    <script>
        const questions = [
            {word:"水樽",image:"images/shui_zun.jpg",semantic_cue:"佢有蓋，可以裝水飲，出街或者做運動嗰陣會帶埋。",phonemic_cue:"水",foil_word:"筷子",correct_aliases:["水樽"]},
            {word:"紙巾",image:"images/zhi_gan.jpg",semantic_cue:"佢好薄嘅、一塊塊，用嚟抹手或者抹嘴。",phonemic_cue:"紙",foil_word:"眼鏡",correct_aliases:["紙巾","紙"]},
            {word:"牙刷",image:"images/ya_sa.jpg",semantic_cue:"佢好長，通常放喺廁所，用嚟刷牙嘅。",phonemic_cue:"牙",foil_word:"洗頭水",correct_aliases:["牙刷"]},
            {word:"毛巾",image:"images/mao_gan.jpg",semantic_cue:"佢好軟熟，沖完涼或者洗完面會用佢嚟抹乾。",phonemic_cue:"毛",foil_word:"梳",correct_aliases:["毛巾","手巾"]},
            {word:"梘液",image:"images/gan_yek.jpg",semantic_cue:"佢係用嚟洗手或者沖涼，好香嘅。",phonemic_cue:"梘",foil_word:"水杯",correct_aliases:["梘液","洗手液"]},
            {word:"風扇",image:"images/fung_sin.jpg",semantic_cue:"佢可以將風吹出嚟，令人涼爽。",phonemic_cue:"風",foil_word:"電視",correct_aliases:["風扇","電風扇"]}
        ];

        let currentQuestionIndex=0, currentCueLevel=0, recognitionActive=false, timer, correctAnswered=false;
        const imageElement=document.getElementById('item-image');
        const messageElement=document.getElementById('message');
        const progressBarElement=document.getElementById('progress-bar');
        const cueButton=document.getElementById('cue-button');
        const startButton=document.getElementById('start-button');
        const synth=window.speechSynthesis;
        let recognition=null;

        function createRecognition(){
            if(recognition) return;
            if(!('SpeechRecognition'in window||'webkitSpeechRecognition'in window)){
                messageElement.textContent="瀏覽器唔支援語音辨識"; startButton.disabled=true; return;
            }
            recognition=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
            recognition.lang='zh-HK'; recognition.interimResults=false;
            recognition.onresult=e=>{clearTimeout(timer);recognitionActive=false;checkAnswer(e.results[0][0].transcript.trim());};
            recognition.onerror=()=>{recognitionActive=false;if(!correctAnswered&&currentCueLevel<4)startNextCueTimer();};
            recognition.onend=()=>recognitionActive=false;
        }

        function speak(text,callback){
            if(!synth){if(callback)callback();return;}
            if(currentCueLevel===2){
                const ch=questions[currentQuestionIndex].phonemic_cue;
                const a=new SpeechSynthesisUtterance("呢個係……");a.lang='zh-HK';a.rate=0.9;
                const b=new SpeechSynthesisUtterance(ch);b.lang='zh-HK';b.rate=0.25;
                a.onend=()=>{synth.speak(b);b.onend=callback||(()=>{});};
                synth.speak(a); return;
            }
            if(text.includes("你試下講一次")){
                const w=questions[currentQuestionIndex].word;
                const p1=`呢個係${w}，你試下講一次，`;
                const u1=new SpeechSynthesisUtterance(p1);u1.lang='zh-HK';u1.rate=0.9;
                const u2=new SpeechSynthesisUtterance(w);u2.lang='zh-HK';u2.rate=0.4;
                const u3=new SpeechSynthesisUtterance("。");u3.lang='zh-HK';u3.rate=0.9;
                u1.onend=()=>{synth.speak(u2);u2.onend=()=>{synth.speak(u3);u3.onend=callback||(()=>{});};};
                synth.speak(u1); return;
            }
            const utt=new SpeechSynthesisUtterance(text);utt.lang='zh-HK';utt.rate=0.9;
            if(callback)utt.onend=callback;
            synth.speak(utt);
        }

        function updateProgress(){
            const p=(currentQuestionIndex/questions.length)*100;
            progressBarElement.style.width=p+'%';
            progressBarElement.textContent=currentQuestionIndex+'/'+questions.length;
            if(currentQuestionIndex===questions.length) progressBarElement.style.backgroundColor='#28a745';
        }

        function startListening(){
            if(!recognition||recognitionActive||correctAnswered) return;
            recognition.start(); recognitionActive=true; startNextCueTimer();
        }

        function startNextCueTimer(){
            clearTimeout(timer);
            timer=setTimeout(()=>{ if(correctAnswered)return; recognitionActive=false; setTimeout(moveToNextCue,1000); },10000);
        }

        function checkAnswer(ans){
            const q=questions[currentQuestionIndex];
            const correct=q.correct_aliases.some(a=>ans.toLowerCase().includes(a.toLowerCase()));
            if(correct){
                correctAnswered=true; clearTimeout(timer); recognition?.stop(); synth.cancel();
                cueButton.style.display='none';
                handleCorrectAnswer(q.word);
            }else{
                setTimeout(moveToNextCue,1500);
            }
        }

        function handleCorrectAnswer(w){
            currentCueLevel=0; correctAnswered=false;
            messageElement.textContent=w;
            const fb=["啱喇","冇錯","做得好"][Math.floor(Math.random()*3)]+`！呢個就係${w}。`;
            speak(fb,()=>setTimeout(moveToNextQuestion,800));
        }

        function moveToNextCue(){
            if(correctAnswered) return;
            currentCueLevel++;
            const q=questions[currentQuestionIndex];
            messageElement.textContent="";
            if(currentCueLevel===1) speak(`你再諗諗。提示：${q.semantic_cue}`,startListening);
            else if(currentCueLevel===2) speak("",startListening);
            else if(currentCueLevel===3){
                const opts=[q.word,q.foil_word]; opts.sort(()=>Math.random()-0.5);
                speak(`你估下，呢個係${opts[0]}定${opts[1]}啊？`,startListening);
            }else{
                cueButton.style.display='none';
                handleFinalAnswer(q.word);
            }
        }

        function handleFinalAnswer(w){
            clearTimeout(timer); currentCueLevel=0;
            messageElement.textContent=w;
            speak(`呢個係${w}，你試下講一次，${w}`,()=>setTimeout(moveToNextQuestion,3000));
        }

        function moveToNextQuestion(){
            currentQuestionIndex++; currentCueLevel=0; correctAnswered=false; updateProgress();
            if(currentQuestionIndex<questions.length) loadQuestion(currentQuestionIndex);
            else handleCompletion();
        }

        function loadQuestion(i){
            const q=questions[i];
            imageElement.src=q.image;
            imageElement.style.display='block';
            cueButton.style.display='block';      // 圖片出現時同時顯示提示鍵（在圖片下方）
            messageElement.textContent="";
            speak("呢個咩嚟架？",startListening);
        }

        function handleCompletion(){
            imageElement.style.display='none';
            cueButton.style.display='none';
            messageElement.textContent="做得非常好，我哋已經完成呢個練習喇！";
            speak("做得非常好，我哋已經完成呢個練習喇！");
            startButton.style.display='block';
            startButton.textContent='重新開始';
        }

        startButton.onclick=()=>{
            createRecognition();
            startButton.style.display='none';
            currentQuestionIndex=-1;
            updateProgress();
            moveToNextQuestion();
        };

        cueButton.onclick=()=>{ 
            if(correctAnswered) return; 
            clearTimeout(timer); recognition?.stop(); synth.cancel(); 
            moveToNextCue(); 
        };

        document.addEventListener('DOMContentLoaded',updateProgress);
    </script>
</body>
</html>
